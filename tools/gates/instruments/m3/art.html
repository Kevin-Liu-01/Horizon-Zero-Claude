<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CALIMA M3 Instruments: surfaces and behaviour (area C)</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    @font-face { font-family: 'IBM Plex Mono'; src: url('/fonts/IBMPlexMono-Regular.woff2') format('woff2'); font-weight: 400; }
    @font-face { font-family: 'IBM Plex Mono'; src: url('/fonts/IBMPlexMono-SemiBold.woff2') format('woff2'); font-weight: 600; }
    @font-face { font-family: 'Chakra Petch'; src: url('/fonts/ChakraPetch-SemiBold.woff2') format('woff2'); font-weight: 600; }
    html, body { margin: 0; height: 100%; background: #7d7a76; overflow: hidden; }
    canvas { display: block; }
    .tag { position: fixed; transform: translate(-50%, 0); font: 600 13px/1.25 'Chakra Petch', sans-serif; color: #1d1b19; text-align: center; white-space: nowrap; }
    .tag small { display: block; font: 400 11px/1.3 'IBM Plex Mono', monospace; color: #2b2926; }
    #note { position: fixed; left: 10px; top: 8px; font: 12px/1.35 'IBM Plex Mono', monospace; color: #1d1b19; max-width: 1180px; }
    #read { position: fixed; left: 10px; bottom: 8px; font: 12px/1.4 'IBM Plex Mono', monospace; color: #1d1b19; white-space: pre; }
    body.dusk .tag, body.dusk #note, body.dusk #read { color: #efe8d8; }
    body.dusk .tag small { color: #d9d1c0; }
  </style>
</head>
<body>
  <div id="note"></div>
  <div id="read"></div>
  <script type="module" src="./art.js"></script>
</body>
</html>
